name: remamber-linux-4090
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pytorch=2.1.1
  - torchvision=0.16.1
  - torchaudio=2.1.1
  - pytorch-cuda=11.8
  - numpy=1.26.4
  - pillow=10.2.0
  - ninja=1.11.1.1
  - setuptools
  - wheel
  - pip:
      - -r requirements.txt
      - ./selective_scan
